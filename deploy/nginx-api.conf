#nginx reverse proxy for api.codejuan.com
#place this file at: /etc/nginx/sites-available/api.codejuan.com
#then symlink: ln -s /etc/nginx/sites-available/api.codejuan.com /etc/nginx/sites-enabled/
#test config: nginx -t
#reload: systemctl reload nginx

server {
    listen 80;
    server_name api.codejuan.com;

    #redirect HTTP to HTTPS (certbot will add this automatically)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.codejuan.com;

    #SSL certificates (certbot will configure these)
    #ssl_certificate /etc/letsencrypt/live/api.codejuan.com/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/api.codejuan.com/privkey.pem;

    #security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    #request size limit
    client_max_body_size 10M;

    #proxy to Node.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    #deny access to dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
